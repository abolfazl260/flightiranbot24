plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// One app identity. CI generates a monotonically increasing build number per
// Android workflow run; no manual version edits or variant-specific IDs.
def apiOrigin = providers.gradleProperty('apiOrigin').orElse(
    providers.environmentVariable('ANDROID_PRODUCTION_API_ORIGIN')).getOrElse('').trim()
if (apiOrigin) {
    URI uri
    try { uri = new URI(apiOrigin) }
    catch (Exception ignored) { throw new GradleException('Invalid Android API origin') }
    if (!'https'.equalsIgnoreCase(uri.scheme) || !uri.host ||
            uri.rawUserInfo != null || uri.rawQuery != null || uri.rawFragment != null ||
            !(uri.rawPath == null || uri.rawPath == '' || uri.rawPath == '/') ||
            !apiOrigin.endsWith('/')) {
        throw new GradleException('Android API origin must be HTTPS without credentials, path or query, ending in /')
    }
}
def versionNumberRaw = providers.gradleProperty('appBuildNumber').orElse(
    providers.environmentVariable('GITHUB_RUN_NUMBER')).getOrElse('1').trim()
if (!(versionNumberRaw ==~ /[1-9][0-9]*/) || versionNumberRaw.length() > 9) {
    throw new GradleException('appBuildNumber must be a positive 1–9 digit CI run number')
}
def buildNumber = Integer.parseInt(versionNumberRaw)
def baseVersion = project.property('appVersionBase').toString()
if (!(baseVersion ==~ /[0-9]+\.[0-9]+/)) {
    throw new GradleException('appVersionBase must follow MAJOR.MINOR')
}
def releaseTag = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
if (releaseTag && !(releaseTag ==~ /v[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException('Android release tags must be vMAJOR.MINOR.PATCH')
}
def resolvedVersionName = releaseTag ? releaseTag.substring(1) : "${baseVersion}.${buildNumber}"
def jsonField = { value -> groovy.json.JsonOutput.toJson(value) }

def signingEnv = [
    'ANDROID_KEYSTORE_FILE',
    'ANDROID_KEYSTORE_PASSWORD',
    'ANDROID_KEY_ALIAS',
    'ANDROID_KEY_PASSWORD'
]
def signingEnabled = signingEnv.every { System.getenv(it)?.trim() }
if (signingEnv.any { System.getenv(it)?.trim() } && !signingEnabled) {
    throw new GradleException('Incomplete Android signing environment (4 variables required).')
}

android {
    namespace 'com.abolfazl260.flightiranbot24'
    compileSdk 36

    defaultConfig {
        applicationId 'com.abolfazl260.flightiranbot24'
        minSdk 24
        targetSdk 36
        versionCode buildNumber
        versionName resolvedVersionName
        buildConfigField 'String', 'API_BASE_URL', jsonField(apiOrigin)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (signingEnabled) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_FILE'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (signingEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            // Preserve the offline airport catalogue bundled in the Java version.
            assets.srcDir('../../src/flightiran/modules/airport/data')
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Android data foundation (AND-003). No live API is called at app launch.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.room:room-runtime:2.7.2'
    implementation 'androidx.room:room-ktx:2.7.2'
    annotationProcessor 'androidx.room:room-compiler:2.7.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.6.1'

    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
