services:
  migrate:
    build: .
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    command: ["python", "-m", "flightiran.db.migrate"]
    restart: "no"

  bot:
    build: .
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran"]

  web:
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
      WEB_APP_ENABLED: "true"
    volumes:
      - flightiran-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran-web"]

  # Opt-in reader of public SQLite tables; no network listener.
  cloudflare-publisher:
    profiles: ["cloudflare"]
    image: flightiranbot24:latest
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran-cloudflare-publish", "--loop", "--interval-seconds", "300"]

  # Private Mini App actions flow FROM Worker to the shared SQLite services.
  # No inbound port, Cloudflare Tunnel, or modification to advertio.ir required.
  cloudflare-mini-bridge:
    profiles: ["cloudflare"]
    image: flightiranbot24:latest
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran-cloudflare-mini-bridge", "--loop", "--interval-seconds", "5"]

volumes:
  flightiran-data:
