services:
  migrate:
    build: .
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    command: ["python", "-m", "flightiran.db.migrate"]
    restart: "no"

  bot:
    build: .
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
    volumes:
      - flightiran-data:/data
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran"]

  web:
    image: flightiranbot24:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/flightiran.db
      WEB_APP_ENABLED: "true"
    volumes:
      - flightiran-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["flightiran-web"]

volumes:
  flightiran-data:
