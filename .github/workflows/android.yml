name: Android Build and Release

# No automatic APK/AAB on pull requests, merges, pushes or tags.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Android checks and debug APK
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check Persian Android UI copy and secure default API origin
        run: python scripts/check_android_ui_contract.py
      - name: Test and build the single Android app with CI-generated version
        run: |
          gradle --no-daemon -p android \
            :app:testDebugUnitTest :app:lintDebug :app:lintRelease \
            :app:assembleDebug :app:assembleDebugAndroidTest :app:bundleRelease
      - name: Verify insecure API and invalid version inputs are rejected
        shell: bash
        run: |
          set -euo pipefail
          reject_env() {
            if env "$@" gradle --offline --no-daemon -p android :app:help > "$RUNNER_TEMP/unsafe-build.log" 2>&1; then
              echo "::error::Unsafe Android build unexpectedly accepted"
              exit 1
            fi
          }
          reject_env ANDROID_PRODUCTION_API_ORIGIN=http://api.example.org/
          reject_env ANDROID_PRODUCTION_API_ORIGIN=https://example.org/path/
          reject_env ANDROID_PRODUCTION_API_ORIGIN=https://user:pass@example.org/
          reject_env GITHUB_RUN_NUMBER=invalid
          env ANDROID_PRODUCTION_API_ORIGIN=https://api.example.org/ \
            gradle --offline --no-daemon -p android :app:help
      - name: Verify single package and automatically derived APK version
        shell: bash
        run: |
          set -euo pipefail
          version="1.0.$GITHUB_RUN_NUMBER"
          python scripts/check_android_environments.py \
            --app-dir android/app/build/outputs \
            --version-code "$GITHUB_RUN_NUMBER" --version-name "$version"
      - name: Verify and display versioned Room v1 schema
        shell: bash
        run: |
          set -euo pipefail
          schema="android/app/schemas/com.abolfazl260.flightiranbot24.data.airports.TravelCacheDatabase/1.json"
          test -s "$schema"
          python -m json.tool "$schema" >/dev/null
          # Enforce that schema changes are intentional, reviewed and committed.
          git ls-files --error-unmatch "$schema" >/dev/null
          git diff --exit-code -- "$schema"
      - name: Generate Play Store art (deterministic)
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0"
          python scripts/generate_android_store_graphics.py --out android/dist/store
      - uses: actions/upload-artifact@v4
        with:
          name: android-play-graphics
          path: android/dist/store/*.png
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14


  release:
    name: Signed APK, AAB and GitHub Release
    # Release only a user-requested build from the current main commit.
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Derive requested release tag and verify current main HEAD
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          base_version="$(sed -n 's/^appVersionBase=//p' android/gradle.properties | tr -d '\r')"
          [[ "$base_version" =~ ^[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid or missing appVersionBase in gradle.properties"
            exit 1
          }
          release_tag="v${base_version}.${GITHUB_RUN_NUMBER}"
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "::error::Only the current reviewed main HEAD may be published"
            exit 1
          }
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release version: $release_tag"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore private upload key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!required}" ]] || {
              echo "::error::Android signing secrets are required for manually requested signed releases."
              exit 1
            }
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flightiran-upload.jks"
          [[ -s "$RUNNER_TEMP/flightiran-upload.jks" ]]
      - name: Build signed release APK and AAB
        env:
          ANDROID_PRODUCTION_API_ORIGIN: ${{ vars.ANDROID_PRODUCTION_API_ORIGIN || 'https://flightiran-public-api.abolfazl260.workers.dev/' }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/flightiran-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon -p android :app:assembleRelease :app:bundleRelease
      - name: Verify signed release APK identity and version
        run: |
          python scripts/check_android_environments.py --release \
            --app-dir android/app/build/outputs \
            --version-code "$GITHUB_RUN_NUMBER" --version-name "${RELEASE_TAG#v}"
      - name: Verify artifact signatures
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/*.apk
          # Self-signed Android upload certificates trigger false -strict failures.
          # Non-strict mode also accepts unsigned archives; explicitly require
          # the exact success marker from jarsigner's signature verification.
          aab_verification="$(jarsigner -verify android/app/build/outputs/bundle/release/*.aab)"
          printf '%s\n' "$aab_verification"
          if ! grep -Fxq 'jar verified.' <<< "$aab_verification"; then
            echo "::error::Release AAB is unsigned or has an invalid JAR signature"
            exit 1
          fi
      - name: Stage signed artifacts with verifiable SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/dist
          cp android/app/build/outputs/apk/release/*.apk "android/dist/FlightIranBot24-$RELEASE_TAG.apk"
          cp android/app/build/outputs/bundle/release/*.aab "android/dist/FlightIranBot24-$RELEASE_TAG.aab"
          (cd android/dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Store signed files as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.version.outputs.tag }}
          path: |
            android/dist/*.apk
            android/dist/*.aab
            android/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Verify live ticket API before publishing GitHub Release
        id: live_api
        continue-on-error: true
        env:
          ANDROID_PRODUCTION_API_ORIGIN: ${{ vars.ANDROID_PRODUCTION_API_ORIGIN || 'https://flightiran-public-api.abolfazl260.workers.dev/' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_PRODUCTION_API_ORIGIN:-}" ]]; then
            echo "::error::A valid HTTPS ticket API origin is required."
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.request
          from urllib.parse import urljoin, urlparse

          origin = os.environ["ANDROID_PRODUCTION_API_ORIGIN"]
          parsed = urlparse(origin)
          if (
              parsed.scheme != "https" or not parsed.hostname
              or parsed.username or parsed.password or parsed.query or parsed.fragment
              or parsed.path not in ("", "/") or not origin.endswith("/")
          ):
              raise SystemExit("Production API origin must be a bare HTTPS origin ending in /")
          with urllib.request.urlopen(
              urllib.request.Request(
                  urljoin(origin, "api/v1/tickets/prices"),
                  headers={"Accept": "application/json"},
              ),
              timeout=15,
          ) as response:
              data = json.load(response)
          if not (
              isinstance(data, dict)
              and data.get("currency") == "TOMAN"
              and data.get("observed_at")
              and isinstance(data.get("routes"), list)
              and data["routes"]
              and data.get("stale") is False
          ):
              raise SystemExit("Deployed API has no usable fresh ticket price data")
          print("Production ticket API reachable and returning recorded prices")
          PY
      - name: Report deferred GitHub Release (signed files are ready)
        if: steps.live_api.outcome != 'success'
        shell: bash
        run: |
          echo '::warning::Signed APK/AAB are available in the android-release artifact, but the public GitHub Release is deferred because the live flight-price API readiness check failed.'
          echo '### Signed Android files are ready' >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: android-release-${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo 'GitHub Release publication was skipped: ticket-price API is unavailable, forbidden, or stale. Restore the public API to enable later automatic releases.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish assets to GitHub Release
        if: steps.live_api.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          files=(android/dist/*.apk android/dist/*.aab android/dist/SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Idempotent on a re-run of this exact GitHub Actions release.
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            # Only a manually dispatched main build may create this version tag.
            # Never reuse an existing tag or overwrite a different published version.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release version tag already exists without a GitHub Release"
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" --title "Flight Iran Bot 24 $RELEASE_TAG" --generate-notes
          fi
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/flightiran-upload.jks"
